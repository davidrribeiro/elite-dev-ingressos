services:
  db:
    image: postgres:16-alpine
    container_name: elite-events-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: elite
      POSTGRES_PASSWORD: elite
      POSTGRES_DB: elite_events
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite -d elite_events"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
